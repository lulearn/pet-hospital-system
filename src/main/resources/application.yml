server:
  port: 8080

spring:
  application:
    name: springboot-demo
  datasource:
    url: jdbc:mysql://localhost:3306/pet_hospital?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: pet-hospital-secret-key-2024-this-is-a-very-long-secret-key
  expiration: 86400000
